name: MindMerge AI CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run lint

      - name: Run Production Build
        run: npm run build
        env:
          # Ensure code is built in production mode
          NODE_ENV: production
          # Supabase vars are injected as build-time args for Vite if needed
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Archive Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-assets
          path: dist/
          retention-days: 7

