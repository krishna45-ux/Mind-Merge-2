<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="32" fill="url(#bg)" />
  
  <!-- Outer Glow / Shadow -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="4" />
  
  <!-- Hair (Back) -->
  <circle cx="64" cy="42" r="24" fill="#0f172a" />
  <circle cx="64" cy="22" r="10" fill="#0f172a" /> <!-- Hair bun -->
  
  <!-- Shoulders / Clothes -->
  <path d="M28 110 C28 85, 40 78, 64 78 C88 78, 100 85, 100 110" fill="#0284c7" /> <!-- Sky Blue Jacket -->
  <path d="M54 78 L64 92 L74 78 Z" fill="#ffffff" /> <!-- Inner top -->
  <circle cx="64" cy="98" r="4" fill="#fb7185" /> <!-- Necklace detail -->

  <!-- Neck -->
  <rect x="56" y="66" width="16" height="16" rx="4" fill="#ffedd5" />

  <!-- Head / Face -->
  <rect x="42" y="34" width="44" height="44" rx="22" fill="#ffedd5" />

  <!-- Hair (Front / Bangs) -->
  <path d="M42 44 C42 32, 86 32, 86 44 C76 38, 52 38, 42 44" fill="#0f172a" />

  <!-- Glasses -->
  <circle cx="53" cy="54" r="8" fill="none" stroke="#1e293b" stroke-width="2" />
  <circle cx="75" cy="54" r="8" fill="none" stroke="#1e293b" stroke-width="2" />
  <line x1="61" y1="54" x2="67" y2="54" stroke="#1e293b" stroke-width="2" />

  <!-- Face features (Eyes, Mouth) -->
  <circle cx="53" cy="54" r="2" fill="#0f172a" />
  <circle cx="75" cy="54" r="2" fill="#0f172a" />
  <path d="M60 67 Q64 70, 68 67" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" />
</svg>
