<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="32" fill="url(#bg)" />
  
  <!-- Outer Glow / Shadow -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="4" />
  
  <!-- Hair (Back) -->
  <circle cx="64" cy="44" r="23" fill="#111827" />

  <!-- Shoulders / Clothes -->
  <path d="M28 110 C28 85, 40 78, 64 78 C88 78, 100 85, 100 110" fill="#4c1d95" /> <!-- Purple blazer -->
  <path d="M54 78 L64 92 L74 78 Z" fill="#e9d5ff" /> <!-- Inner lilac top -->

  <!-- Neck -->
  <rect x="56" y="66" width="16" height="16" rx="4" fill="#ffedd5" />

  <!-- Head / Face -->
  <rect x="42" y="34" width="44" height="44" rx="22" fill="#ffedd5" />

  <!-- Hair (Front / Fringe) -->
  <path d="M42 42 C42 30, 86 30, 86 42 C72 36, 56 36, 42 42" fill="#111827" />

  <!-- Face features (Eyes, Mouth) -->
  <circle cx="53" cy="53" r="2" fill="#0f172a" />
  <circle cx="75" cy="53" r="2" fill="#0f172a" />
  <path d="M59 66 Q64 70, 69 66" fill="none" stroke="#db2777" stroke-width="2.5" stroke-linecap="round" />
</svg>
