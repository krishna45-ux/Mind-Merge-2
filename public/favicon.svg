<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#172033"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#24979d"/>
      <stop offset="45%" style="stop-color:#8781ff"/>
      <stop offset="100%" style="stop-color:#ef7f45"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5b26b"/>
      <stop offset="100%" style="stop-color:#ef7f45"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Brain/merge icon - stylized overlapping curves -->
  <g transform="translate(256,270)">
    <!-- Left brain half -->
    <path d="M-20,-100 C-90,-100 -130,-60 -130,0 C-130,40 -110,70 -80,85 C-60,95 -35,90 -20,75 C-10,65 -5,50 -5,30 C-5,10 -15,-5 -30,-5 C-45,-5 -50,10 -45,25" 
          fill="none" stroke="url(#icon)" stroke-width="28" stroke-linecap="round"/>
    <!-- Right brain half -->
    <path d="M20,-100 C90,-100 130,-60 130,0 C130,40 110,70 80,85 C60,95 35,90 20,75 C10,65 5,50 5,30 C5,10 15,-5 30,-5 C45,-5 50,10 45,25"
          fill="none" stroke="url(#icon)" stroke-width="28" stroke-linecap="round"/>
    <!-- Central merge line -->
    <line x1="0" y1="-105" x2="0" y2="-60" stroke="url(#icon)" stroke-width="22" stroke-linecap="round"/>
  </g>
  <!-- Sparkle top-right -->
  <g transform="translate(370,105)">
    <path d="M0,-32 L6,-6 L32,0 L6,6 L0,32 L-6,6 L-32,0 L-6,-6 Z" fill="url(#sparkle)"/>
  </g>
  <!-- Small sparkle -->
  <g transform="translate(145,130)">
    <path d="M0,-16 L3,-3 L16,0 L3,3 L0,16 L-3,3 L-16,0 L-3,-3 Z" fill="#74d4c8" opacity="0.8"/>
  </g>
</svg>
